[package]
name = "studio-states"
version = "0.0.1"
description = "Vibe Studio states — persisted application state on SQLite, no shell dependencies."
edition = "2024"

[lib]
name = "studio_states"
path = "src/lib.rs"

[dependencies]
diesel = { version = "2.3", features = ["sqlite", "chrono"] }
chrono = "0.4.43"
serde_with = { version = "3.16", features = ["chrono"] }
diesel_migrations = "2"
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
