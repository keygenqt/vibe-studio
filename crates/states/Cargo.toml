[package]
name = "vibe-states"
version = "0.0.1"
description = "Vibe Studio states — persisted application state on SQLite, no shell dependencies."
edition = "2024"

[lib]
name = "vibe_states"
path = "src/lib.rs"

[dependencies]
diesel = { version = "2.3", features = ["sqlite"] }
diesel_migrations = "2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
anyhow = "1.0.104"
