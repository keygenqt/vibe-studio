[package]
name = "studio-core"
version = "0.0.1"
description = "Vibe Studio core — state facade and feature functions, no shell dependencies."
edition = "2024"

[lib]
name = "studio_core"
path = "src/lib.rs"

[dependencies]
studio-states = { path = "../states" }
studio-cluster = { path = "../cluster" }
dark-light = "3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
anyhow = "1.0.104"
tokio = { version = "1", default-features = false, features = [
    "sync",
    "macros",
] }
clipboard-rs = { version = "0.3.5", features = ["wayland"] }
open = "5"
base64 = "0.23"
image = "0.25"
url = "2.5"
