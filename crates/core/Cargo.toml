[package]
name = "vibe-core"
version = "0.0.1"
description = "Vibe Studio core — application state and storage, no shell dependencies."
edition = "2024"

[lib]
name = "vibe_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
anyhow = "1.0.104"
