# Vibe Studio Book
# Builds mdBook documentation and serves via Nginx

name: vibe-studio-book

services:
  builder:
    container_name: vibe-studio-book-builder
    image: rust:slim
    working_dir: /build
    volumes:
      - .:/build
      - book-output:/output
    command:
      - bash
      - -c
      - |
        mkdir -p /output
        rm -rf /output/*
        cargo install mdbook
        mdbook build --dest-dir /output

  book:
    container_name: vibe-studio-book
    image: nginx:stable-alpine
    restart: always
    ports:
      - '3005:80'
    volumes:
      - book-output:/usr/share/nginx/html:ro
    depends_on:
      builder:
        condition: service_completed_successfully

volumes:
  book-output:
